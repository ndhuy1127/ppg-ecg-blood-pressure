name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruff and pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check for unresolved git conflict markers
        run: |
          echo "Checking for conflict markers..."
          if grep -rnE "^(<<<<<<<|=======|>>>>>>>)" --exclude-dir=.venv .; then
            echo "Error: Found unresolved Git conflict markers!"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Pytest
        run: pytest -q

      - name: Check environment
        run: python scripts/check_environment.py
