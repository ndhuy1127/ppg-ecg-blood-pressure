name: CI Checks

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check for unresolved git conflict markers
        run: |
          echo "Checking for conflict markers..."
          if grep -rnE "^(<<<<<<<|=======|>>>>>>>)" --exclude-dir=.venv .; then
            echo "Error: Found unresolved Git conflict markers!"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Verify dependencies consistency
        run: |
          python -m pip check

      - name: Run linter (ruff)
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest -q

      - name: Check environment setup
        run: |
          if [ -f scripts/check_environment.py ]; then python scripts/check_environment.py; fi