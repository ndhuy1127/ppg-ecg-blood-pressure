; Firmware skeleton of the V1-module (ESP32-S3 DevKitC, ESP-IDF via PlatformIO).
; Build: pio run -d firmware. See firmware/README.md (section "Bản build" lists
; every env and when to use it). Values measured at bring-up (SAMP edge
; polarity, LED pulse width) are passed at build time, not edited here:
; PLATFORMIO_BUILD_FLAGS="-DBOARD_SAMP_RISING_EDGE=1 -DBOARD_PPG_LED_PW_US=215"
; (PlatformIO appends it to build_flags of every env).

[platformio]
src_dir = app
include_dir = include
default_envs = esp32s3_devkitc

[env:esp32s3_devkitc]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; The same firmware with deliberate IMU read stalls (a backlog read split into
; packets, then a full FIFO and a re-anchor), Packet Schema V0.2 section 9 step
; 2b: pio run -d firmware -e esp32s3_devkitc_imu_stall
[env:esp32s3_devkitc_imu_stall]
extends = env:esp32s3_devkitc
build_flags = -DFAKE_IMU_STALLS=1

; Fake SAMP faults: every 20 s one dropped and one spurious edge, so the mapping
; goes to the error state and restarts (Packet Schema V0.2 section 9 step 2c):
; pio run -d firmware -e esp32s3_devkitc_samp_faults
[env:esp32s3_devkitc_samp_faults]
extends = env:esp32s3_devkitc
build_flags = -DFAKE_SAMP_FAULTS=1

; Fake PPG reader late by 12 ms every 10 s, so a drain finds about 10 samples
; (Packet Schema V0.2 section 9 step 2d):
; pio run -d firmware -e esp32s3_devkitc_ppg_delay
[env:esp32s3_devkitc_ppg_delay]
extends = env:esp32s3_devkitc
build_flags = -DFAKE_PPG_DELAY=1

; ECG from a real MAX30001 on SPI bus 1 (drivers/max30001.c) with the SAMP
; capture on INT2B; PPG and IMU stay fake. For bring-up section 7 only, once the
; breakout is on the base board: pio run -d firmware -e esp32s3_devkitc_ecg_real
[env:esp32s3_devkitc_ecg_real]
extends = env:esp32s3_devkitc
build_flags = -DBOARD_ECG_REAL=1 -DBOARD_SAMP_CAPTURE=1

; PPG from a real MAX30101 on I2C bus 1 (drivers/max30101.c); ECG and IMU stay
; fake. Bring-up section 8: pio run -d firmware -e esp32s3_devkitc_ppg_real
[env:esp32s3_devkitc_ppg_real]
extends = env:esp32s3_devkitc
build_flags = -DBOARD_PPG_REAL=1

; IMU from a real BMI270 on SPI bus 2 (drivers/bmi270.c); ECG and PPG stay fake.
; Bring-up: pio run -d firmware -e esp32s3_devkitc_imu_real
[env:esp32s3_devkitc_imu_real]
extends = env:esp32s3_devkitc
build_flags = -DBOARD_IMU_REAL=1

; The three real chips together with the SAMP capture, bit 8 off (the SAMP
; mapping is not verified), no sync stimulus, no fault injection (decided
; 2026-10-29). Bring-up section 8 steps 8 and 9 (whole system, 75-minute run):
; pio run -d firmware -e esp32s3_devkitc_all_real
[env:esp32s3_devkitc_all_real]
extends = env:esp32s3_devkitc
build_flags = -DBOARD_ECG_REAL=1 -DBOARD_SAMP_CAPTURE=1 -DBOARD_SAMP_VERIFIED=0
    -DBOARD_PPG_REAL=1 -DBOARD_IMU_REAL=1

; 10-minute sync test (hardware/test_reports/sync_10min_test_plan.md): the three
; real chips, SAMP capture with bit 8 (the test measures L_ECG,SAMP), and the
; stimulus pulses on GPIO6 with event code 3. BOARD_SAMP_VERIFIED=1 claims that
; bring-up section 7 step 4 showed the first SAMP edge belongs to the first FIFO
; sample: flash this env only after that check passed, built with the SAMP edge
; polarity measured there (BOARD_SAMP_RISING_EDGE) and the LED pulse width
; chosen at bring-up section 8 (BOARD_PPG_LED_PW_US, 411 by default). On the MCU
; board alone the chips give up and only the pulses and events remain.
[env:esp32s3_devkitc_sync10]
extends = env:esp32s3_devkitc
build_flags = -DBOARD_ECG_REAL=1 -DBOARD_SAMP_CAPTURE=1 -DBOARD_SAMP_VERIFIED=1
    -DBOARD_PPG_REAL=1 -DBOARD_IMU_REAL=1 -DBOARD_STIM=1
