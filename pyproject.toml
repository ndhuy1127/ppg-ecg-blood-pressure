[project]
name = "ppg-ecg-blood-pressure"
version = "0.1.0"
description = "Research scaffold for wrist-worn PPG and ECG blood-pressure variation estimation."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
