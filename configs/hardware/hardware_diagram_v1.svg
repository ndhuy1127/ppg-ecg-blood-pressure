<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Sơ đồ khối V1-module</title>
  <defs>
    <marker id="a-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="a-pwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="a-ana" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
    <marker id="a-usb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="1280" height="960" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0d47a1">Sơ đồ khối V1-module (dùng module, thu ECG + PPG)</text>
  <text x="640" y="56" text-anchor="middle" fill="#455a64">Theo configs/hardware/custom_board_proposal.md Phần A, pin map A.7 và protocol v0.2 mục 5.2 (2026-10-23). Chưa đo trên phần cứng.</text>

  <!-- Body column -->
  <rect x="20" y="80" width="290" height="860" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-dasharray="6 4"/>
  <text x="34" y="102" font-weight="bold" fill="#424242">Trên người (chỉ sau phê duyệt đạo đức)</text>

  <rect x="36" y="118" width="258" height="170" rx="8" fill="#eceff1" stroke="#37474f"/>
  <text x="48" y="140" font-weight="bold" fill="#263238">Ba điện cực Ag/AgCl dán</text>
  <text x="48" y="162" fill="#263238">LA: mặt lòng cổ tay trái</text>
  <text x="48" y="182" fill="#263238">RA: mặt lòng cổ tay phải</text>
  <text x="48" y="202" fill="#263238">RL (tham chiếu): cẳng tay trái,</text>
  <text x="48" y="220" fill="#263238">cách LA khoảng 5 cm</text>
  <text x="48" y="242" fill="#263238">Đạo trình I = LA − RA</text>
  <text x="48" y="266" fill="#263238">Nối qua cáp 3 điện cực của kit</text>

  <rect x="36" y="660" width="258" height="96" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="48" y="682" font-weight="bold" fill="#4a148c">Vị trí bo cổ tay</text>
  <text x="48" y="704" fill="#4a148c">Mặt lưng cổ tay trái, cách</text>
  <text x="48" y="722" fill="#4a148c">mỏm trâm trụ 1,5–2,0 cm,</text>
  <text x="48" y="740" fill="#4a148c">dây velcro 20 mm</text>

  <rect x="36" y="790" width="258" height="130" rx="8" fill="#fff8e1" stroke="#757575" stroke-dasharray="5 3"/>
  <text x="48" y="812" font-weight="bold" fill="#424242">Máy đo cuff bắp tay phải</text>
  <text x="48" y="834" fill="#424242">Thiết bị riêng, không nối vào</text>
  <text x="48" y="852" fill="#424242">mạch. Bấm t0 trên bo đế khi</text>
  <text x="48" y="870" fill="#424242">bắt đầu bơm; SBP/DBP nhập</text>
  <text x="48" y="888" fill="#424242">tay trên PC theo event_id</text>

  <!-- Base board container -->
  <rect x="340" y="80" width="580" height="480" rx="10" fill="#fbfdff" stroke="#546e7a" stroke-dasharray="6 4"/>
  <text x="354" y="102" font-weight="bold" fill="#37474f">Bo đế (đặt trên bàn), KiCad v1_base</text>

  <!-- MAX30001 -->
  <rect x="360" y="118" width="250" height="196" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="372" y="140" font-weight="bold" fill="#1b5e20">Breakout ProtoCentral MAX30001</text>
  <text x="372" y="160" fill="#1b5e20">ECG AFE, ADC 18 bit, 512 sps</text>
  <text x="372" y="180" fill="#1b5e20">Trên breakout: LDO 1,8 V,</text>
  <text x="372" y="198" fill="#1b5e20">TXB0108, dao động 32,768 kHz</text>
  <text x="372" y="218" fill="#1b5e20">Jack 3,5 mm: ring → ECGP (LA),</text>
  <text x="372" y="236" fill="#1b5e20">tip → ECGN (RA), sleeve → R3</text>
  <text x="372" y="254" fill="#1b5e20">220 kΩ → VCM (RL)</text>
  <text x="372" y="274" fill="#1b5e20">BioZ tắt; gỡ R7, R8</text>
  <text x="372" y="292" font-size="11" fill="#1b5e20">SPI 1: GPIO7/15/16/17</text>
  <text x="372" y="306" font-size="11" fill="#1b5e20">INTB → GPIO21; SAMP (INT2B) → GPIO47</text>

  <!-- ESP32 -->
  <rect x="660" y="118" width="244" height="300" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="672" y="140" font-weight="bold" fill="#0d47a1">ESP32-S3-DevKitC-1</text>
  <text x="672" y="160" fill="#0d47a1">Module WROOM-1 N8R8/N16R8,</text>
  <text x="672" y="178" fill="#0d47a1">GPIO 3,3 V (kể cả GPIO47)</text>
  <text x="672" y="200" fill="#0d47a1">Đồng hồ chung: esp_timer µs</text>
  <text x="672" y="220" fill="#0d47a1">Chốt số mẫu FIFO rồi ghi</text>
  <text x="672" y="238" fill="#0d47a1">T_ANCHOR_US (schema mục 5)</text>
  <text x="672" y="260" fill="#0d47a1">Đóng packet V0.1 theo kênh:</text>
  <text x="672" y="278" fill="#0d47a1">0xE1 ECG, 0xF1–F3 PPG,</text>
  <text x="672" y="296" fill="#0d47a1">0xC1 sự kiện t0</text>
  <text x="672" y="318" fill="#0d47a1">LDO 3,3 V của DevKitC cấp</text>
  <text x="672" y="336" fill="#0d47a1">cho cả hai bo</text>
  <text x="672" y="358" fill="#0d47a1">Lắp vào 2 socket 1×22,</text>
  <text x="672" y="376" fill="#0d47a1">hai hàng cách 22,86 mm</text>
  <text x="672" y="398" fill="#0d47a1">Không có pin LiPo ở V1</text>

  <!-- t0 button -->
  <rect x="360" y="336" width="250" height="70" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="372" y="358" font-weight="bold" fill="#e65100">Nút t0 (SW1) và LED D1</text>
  <text x="372" y="378" fill="#e65100">SW1 → GPIO4 (kéo lên 10 kΩ,</text>
  <text x="372" y="396" fill="#e65100">100 nF); D1 ← GPIO5 qua 1 kΩ</text>

  <!-- J2 -->
  <rect x="360" y="430" width="250" height="110" rx="8" fill="#f5f5f5" stroke="#616161"/>
  <text x="372" y="452" font-weight="bold" fill="#212121">J2: box header IDC 2×8</text>
  <text x="372" y="472" fill="#212121">R9–R11 33 Ω nối tiếp trên</text>
  <text x="372" y="490" fill="#212121">BMI_SCK, MOSI, CS (mặt dưới)</text>
  <text x="372" y="510" fill="#212121">C9 100 nF sát J2.1/J2.2</text>
  <text x="372" y="528" fill="#212121">GND: chân 2, 4, 6, 8, 10, 12, 14</text>

  <!-- Wrist board container -->
  <rect x="340" y="620" width="580" height="320" rx="10" fill="#fdfbff" stroke="#6a1b9a" stroke-dasharray="6 4"/>
  <text x="354" y="642" font-weight="bold" fill="#4a148c">Bo cổ tay 40,4 × 31,5 mm, KiCad v1_wrist</text>

  <rect x="360" y="656" width="544" height="48" rx="8" fill="#f5f5f5" stroke="#616161"/>
  <text x="372" y="678" font-weight="bold" fill="#212121">J1: box header 2×8 cong 90°, có khóa, hàn ở mặt dưới</text>
  <text x="372" y="696" fill="#212121">Không có test point; C2 10 µF + C3 100 nF dùng chung cho hai module</text>

  <rect x="360" y="728" width="270" height="196" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="372" y="750" font-weight="bold" fill="#4a148c">SparkFun MAX30101 (SEN-16474)</text>
  <text x="372" y="770" fill="#4a148c">Mặt trên, áp da. LED xanh ~537 nm,</text>
  <text x="372" y="788" fill="#4a148c">đỏ ~660 nm, IR ~880 nm; photodiode,</text>
  <text x="372" y="806" fill="#4a148c">ADC và FIFO trong chip</text>
  <text x="372" y="826" fill="#4a148c">Trên bo: LDO 1,8 V (VDD),</text>
  <text x="372" y="844" fill="#4a148c">boost PAM2401 → VLED 5,1 V</text>
  <text x="372" y="864" fill="#4a148c">Multi-LED 3 khe, ≤ 200 sps</text>
  <text x="372" y="884" fill="#4a148c">I²C địa chỉ 0x57, dao động nội</text>
  <text x="372" y="904" fill="#4a148c">Cắt JP1 (LED nguồn)</text>

  <rect x="650" y="728" width="254" height="130" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="662" y="750" font-weight="bold" fill="#8d6e00">SparkFun BMI270 (SEN-22397)</text>
  <text x="662" y="770" fill="#8d6e00">Mặt dưới. IMU 6 trục, đo</text>
  <text x="662" y="788" fill="#8d6e00">chuyển động tay đeo PPG</text>
  <text x="662" y="808" fill="#8d6e00">SPI (cắt jumper I2C, ADR)</text>

  <!-- Laptop -->
  <rect x="960" y="118" width="300" height="206" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="972" y="140" font-weight="bold" fill="#263238">Laptop chạy pin, rút sạc</text>
  <text x="972" y="162" fill="#263238">scripts/packet_logger.py:</text>
  <text x="972" y="180" fill="#263238">decode, kiểm SYNC/CRC/SEQ,</text>
  <text x="972" y="198" fill="#263238">FIRST_SAMPLE_INDEX, T_ANCHOR_US;</text>
  <text x="972" y="216" fill="#263238">ghi raw bất biến + manifest, hash</text>
  <text x="972" y="238" fill="#263238">t_rx của PC chỉ để chẩn đoán,</text>
  <text x="972" y="256" fill="#263238">không dùng làm thời gian mẫu</text>
  <text x="972" y="278" fill="#263238">Không nối điện lưới khi người</text>
  <text x="972" y="296" fill="#263238">tham gia đang đeo thiết bị</text>

  <!-- Timing notes -->
  <rect x="960" y="350" width="300" height="210" rx="8" fill="#ffffff" stroke="#90a4ae"/>
  <text x="972" y="372" font-weight="bold" fill="#37474f">Thời gian và đồng bộ</text>
  <text x="972" y="394" fill="#37474f">ECG theo dao động 32,768 kHz,</text>
  <text x="972" y="412" fill="#37474f">PPG theo dao động nội MAX30101:</text>
  <text x="972" y="430" fill="#37474f">hai AFE không chung clock</text>
  <text x="972" y="452" fill="#37474f">SAMP (INT2B) báo lúc mẫu ECG vào</text>
  <text x="972" y="470" fill="#37474f">FIFO, không phải lúc lấy mẫu</text>
  <text x="972" y="492" fill="#37474f">Drift, jitter, lệch ECG–PPG đo</text>
  <text x="972" y="510" fill="#37474f">bằng kích thích chung (kế hoạch</text>
  <text x="972" y="528" fill="#37474f">10 phút), không dùng PAT</text>
  <text x="972" y="546" fill="#37474f">PAT = PEP + PTT</text>

  <!-- Legend -->
  <rect x="960" y="620" width="300" height="230" rx="8" fill="#ffffff" stroke="#90a4ae"/>
  <text x="972" y="642" font-weight="bold" fill="#37474f">Chú thích</text>
  <line x1="974" y1="664" x2="1024" y2="664" stroke="#37474f" stroke-width="2" marker-end="url(#a-ana)"/>
  <text x="1034" y="668" fill="#37474f">Tín hiệu điện cực (analog)</text>
  <line x1="974" y1="692" x2="1024" y2="692" stroke="#1565c0" stroke-width="2" marker-end="url(#a-sig)"/>
  <text x="1034" y="696" fill="#37474f">SPI, I²C, ngắt, GPIO</text>
  <line x1="974" y1="720" x2="1024" y2="720" stroke="#c62828" stroke-width="2" marker-end="url(#a-pwr)"/>
  <text x="1034" y="724" fill="#37474f">Nguồn</text>
  <line x1="974" y1="748" x2="1024" y2="748" stroke="#2e7d32" stroke-width="2" marker-end="url(#a-usb)"/>
  <text x="1034" y="752" fill="#37474f">USB (dữ liệu và nguồn 5 V)</text>
  <line x1="974" y1="776" x2="1024" y2="776" stroke="#616161" stroke-width="3" stroke-dasharray="9 4"/>
  <text x="1034" y="780" fill="#37474f">Cáp dẹt 16 dây</text>
  <text x="972" y="808" fill="#37474f">Số GPIO theo bảng A.7.</text>
  <text x="972" y="826" fill="#37474f">Packet: Packet_Schema_V0.1.md.</text>
  <text x="972" y="844" fill="#37474f">Bring-up: v1_bringup_procedure.md.</text>

  <!-- Electrodes -> MAX30001 -->
  <path d="M294,200 L358,200" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#a-ana)"/>

  <!-- MAX30001 <-> ESP32 -->
  <path d="M610,170 L658,170" stroke="#1565c0" stroke-width="2" fill="none" marker-start="url(#a-sig)" marker-end="url(#a-sig)"/>
  <text x="614" y="162" font-size="11" fill="#1565c0">SPI 1</text>
  <path d="M610,226 L658,226" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#a-sig)"/>
  <text x="614" y="218" font-size="11" fill="#1565c0">INTB</text>
  <path d="M610,276 L658,276" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#a-sig)"/>
  <text x="614" y="268" font-size="11" fill="#1565c0">SAMP</text>

  <!-- ESP32 -> MAX30001 power -->
  <path d="M658,326 L634,326 L634,306 L612,306" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#a-pwr)"/>
  <text x="636" y="320" font-size="10" fill="#c62828">3V3</text>

  <!-- t0 -> ESP32 -->
  <path d="M610,372 L658,372" stroke="#1565c0" stroke-width="2" fill="none" marker-start="url(#a-sig)" marker-end="url(#a-sig)"/>
  <text x="614" y="364" font-size="11" fill="#1565c0">GPIO4/5</text>

  <!-- J2 <-> ESP32 -->
  <path d="M610,470 L782,470 L782,420" stroke="#1565c0" stroke-width="2" fill="none" marker-start="url(#a-sig)" marker-end="url(#a-sig)"/>
  <text x="616" y="462" font-size="11" fill="#1565c0">I²C 1: GPIO8/9, INT 18</text>
  <text x="616" y="490" font-size="11" fill="#1565c0">SPI 2: GPIO10–13, INT1 14</text>
  <path d="M610,520 L850,520 L850,420" stroke="#c62828" stroke-width="2" fill="none" marker-start="url(#a-pwr)"/>
  <text x="700" y="514" font-size="11" fill="#c62828">3V3, GND (cáp chân 1, 2)</text>

  <!-- Cable J2 -> J1 -->
  <path d="M485,540 L485,656" stroke="#616161" stroke-width="3" fill="none" stroke-dasharray="9 4"/>
  <text x="496" y="592" font-size="12" font-weight="bold" fill="#424242">Cáp dẹt IDC 16 dây, 20–30 cm (chân n ↔ chân n)</text>

  <!-- J1 -> sensors -->
  <path d="M495,704 L495,726" stroke="#1565c0" stroke-width="2" fill="none" marker-start="url(#a-sig)" marker-end="url(#a-sig)"/>
  <text x="502" y="720" font-size="11" fill="#1565c0">I²C 1, INT</text>
  <path d="M777,704 L777,726" stroke="#1565c0" stroke-width="2" fill="none" marker-start="url(#a-sig)" marker-end="url(#a-sig)"/>
  <text x="784" y="720" font-size="11" fill="#1565c0">SPI 2, INT1</text>

  <!-- Body wrist marker -->
  <path d="M294,708 L358,760" stroke="#6a1b9a" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

  <!-- ESP32 <-> Laptop -->
  <path d="M904,170 L958,170" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#a-usb)"/>
  <text x="924" y="162" font-size="10" fill="#2e7d32">USB</text>
  <text x="924" y="186" font-size="10" fill="#2e7d32">native</text>
  <path d="M904,240 L958,240" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#a-usb)"/>
  <text x="924" y="232" font-size="10" fill="#2e7d32">UART0</text>
  <path d="M958,300 L906,300" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#a-pwr)"/>
  <text x="922" y="292" font-size="10" fill="#c62828">5 V</text>
  <text x="922" y="316" font-size="10" fill="#c62828">USB</text>
  <text x="972" y="340" font-size="11" fill="#2e7d32">USB native: packet V0.1; UART0: log chữ</text>
</svg>
